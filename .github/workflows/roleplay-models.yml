# Renews roleplay-models.html daily (and by hand) from OpenRouter's weekly roleplay ranking (the secret OPENROUTER_API_KEY),
# its model list's prices and LMArena's latest text leaderboard (Hugging Face, no key); commits the page only when it
# changed, with the sitemap's day for it, then starts pages.yml, since a push by GITHUB_TOKEN starts no workflow but
# a workflow_dispatch by it does. The leaderboards fetched are kept in data/arena-history.json, committed on their own
# where only they changed.
# A failed fetch, a ranking without a whole week or an empty LMArena category fails the run and changes nothing.
# Runs only on main, the branch the site deploys from.
name: Roleplay models

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: roleplay-models
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the sitemap takes each page's day from its last commit

      - name: Test
        run: python3 -m unittest discover -s tools/tests

      - name: Write the page
        run: python3 tools/roleplay_models.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

      - name: Commit and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -N data/arena-history.json
          if git diff --quiet -- roleplay-models.html data/arena-history.json; then
            echo "The page and the history are unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- roleplay-models.html; then
            git commit -m "Roleplay models: LMArena history kept" -- data/arena-history.json
            git push
            exit 0
          fi
          python3 build.py sitemap
          git commit -m "Roleplay models: OpenRouter's ranking and LMArena renewed" -- roleplay-models.html sitemap.xml data/arena-history.json
          git push
          gh workflow run pages.yml --ref main
